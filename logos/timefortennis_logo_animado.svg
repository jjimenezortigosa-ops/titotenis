<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Logo animado de Time for Tennis: una derecha paralela cae justo fuera de la línea (OUT) y la pelota se convierte en el reloj de la O">
<style>
.t{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
#scene{animation-name:sc}
@keyframes sc{0%,40%{opacity:1}46%,97%{opacity:0}100%{opacity:1}}
#arm{transform-box:view-box;transform-origin:192px 262px;animation-name:sw}
@keyframes sw{0%{transform:rotate(-150deg)}6%{transform:rotate(-150deg)}11%{transform:rotate(-60deg)}13.5%{transform:rotate(5deg)}18%{transform:rotate(95deg)}30%,100%{transform:rotate(95deg)}}
#body{transform-box:view-box;transform-origin:170px 330px;animation-name:bd}
@keyframes bd{0%,6%{transform:rotate(-3deg)}13.5%{transform:rotate(4deg)}18%,100%{transform:rotate(2deg)}}
#ball1{offset-path:path('M228 296 Q352 96 482 206');animation-name:fl;opacity:0}
@keyframes fl{0%,13%{offset-distance:0%;opacity:0;transform:scale(1)}13.5%{opacity:1;offset-distance:0%;transform:scale(1)}24%{opacity:1;offset-distance:100%;transform:scale(.5)}25%,100%{offset-distance:100%;opacity:0}}
#shadow{offset-path:path('M228 330 L482 206');animation-name:fs;opacity:0}
@keyframes fs{0%,13%{offset-distance:0%;opacity:0}13.5%{opacity:.5;offset-distance:0%}24%{opacity:.5;offset-distance:100%}25%,100%{offset-distance:100%;opacity:0}}
#trail{stroke-dasharray:420;stroke-dashoffset:420;animation-name:tr;opacity:.45}
@keyframes tr{0%,13%{stroke-dashoffset:420;opacity:.45}24%{stroke-dashoffset:0;opacity:.45}30%{opacity:0}100%{stroke-dashoffset:420;opacity:0}}
#mark{animation-name:mk;opacity:0}
@keyframes mk{0%,24%{opacity:0}25%,40%{opacity:1}44%,100%{opacity:0}}
#zoom{animation-name:zm;opacity:0;transform-box:view-box;transform-origin:360px 220px}
@keyframes zm{0%,29%{opacity:0;transform:scale(.3)}33%{opacity:1;transform:scale(1)}42%{opacity:1;transform:scale(1)}46%,100%{opacity:0;transform:scale(1.15)}}
#zball{animation-name:zb;opacity:0}
@keyframes zb{0%,33%{opacity:0;transform:translate(60px,-40px)}35.5%{opacity:1;transform:translate(0,0)}42%{opacity:1}44%,100%{opacity:0}}
#outtxt{animation-name:ot;opacity:0}
@keyframes ot{0%,36%{opacity:0}37%{opacity:1}38%{opacity:.25}39%{opacity:1}42%{opacity:1}45%,100%{opacity:0}}
#word{animation-name:wd;opacity:0}
@keyframes wd{0%,45%{opacity:0}47%,95%{opacity:1}99%,100%{opacity:0}}
#clock{transform-box:view-box;transform-origin:230px 220px;animation-name:ck;opacity:0}
@keyframes ck{0%,45%{opacity:0;transform:translate(130px,0) scale(.35)}53%{opacity:1;transform:translate(0,0) scale(1.08)}56%,100%{opacity:1;transform:scale(1)}}
#face{animation-name:fc;opacity:0}
@keyframes fc{0%,53%{opacity:0}59%,100%{opacity:1}}
#hm{transform-box:view-box;transform-origin:230px 220px;animation-name:hm}
@keyframes hm{0%,53%{transform:rotate(0)}100%{transform:rotate(1080deg)}}
#hh{transform-box:view-box;transform-origin:230px 220px;animation-name:hh}
@keyframes hh{0%,53%{transform:rotate(300deg)}100%{transform:rotate(390deg)}}
.ld{stroke-dasharray:420;stroke-dashoffset:420;animation-name:dr}
@keyframes dr{0%,55%{stroke-dashoffset:420}63%,100%{stroke-dashoffset:0}}
.ld2{stroke-dasharray:420;stroke-dashoffset:420;animation-name:dr2}
@keyframes dr2{0%,61%{stroke-dashoffset:420}69%,100%{stroke-dashoffset:0}}
#sub{animation-name:sb;opacity:0}
@keyframes sb{0%,67%{opacity:0}75%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.t{animation:none!important}#scene,#zoom,#mark,#ball1,#shadow,#trail{opacity:0}#word,#clock,#face,#sub{opacity:1;transform:none}.ld,.ld2{stroke-dashoffset:0}#hm{transform:rotate(60deg)}#hh{transform:rotate(330deg)}}
</style>
<defs>
<linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a5a4c"/><stop offset="1" stop-color="#0f3d33"/></linearGradient>
<linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1F1D" stop-opacity="0"/><stop offset="1" stop-color="#0C1F1D" stop-opacity=".55"/></linearGradient>
<clipPath id="zc"><circle cx="360" cy="220" r="147"/></clipPath>
</defs>
<rect width="720" height="440" fill="#0C1F1D"/>

<g id="scene" class="t">
  <!-- pista en perspectiva (cámara detrás de la línea de fondo) -->
  <polygon points="0,440 720,440 520,150 200,150" fill="#0f3d33"/>
  <polygon points="20,400 700,400 475,165 245,165" fill="url(#cg)"/>
  <g fill="none" stroke="#F4F1E8" stroke-linecap="round">
    <g stroke-width="3.2">
      <line x1="20" y1="400" x2="700" y2="400"/><line x1="245" y1="165" x2="475" y2="165"/>
      <line x1="20" y1="400" x2="245" y2="165"/><line x1="700" y1="400" x2="475" y2="165"/>
      <line x1="105" y1="400" x2="274" y2="165"/><line x1="615" y1="400" x2="446" y2="165"/>
    </g>
    <g stroke-width="2.4" opacity=".75">
      <line x1="298" y1="248" x2="422" y2="248"/>
      <line x1="298" y1="248" x2="279" y2="300"/>
    </g>
  </g>
  <!-- línea de saque y T -->
  <g stroke="#F4F1E8" stroke-width="2.4" opacity=".7" fill="none">
    <line x1="360" y1="205" x2="360" y2="250"/>
    <line x1="296" y1="205" x2="424" y2="205"/>
  </g>
  <!-- red -->
  <g>
    <line x1="137" y1="270" x2="583" y2="270" stroke="#F4F1E8" stroke-width="2" opacity=".5"/>
    <rect x="137" y="242" width="446" height="28" fill="#0C1F1D" opacity=".55"/>
    <g stroke="#F4F1E8" stroke-width=".7" opacity=".3"><line x1="137" y1="249" x2="583" y2="249"/><line x1="137" y1="256" x2="583" y2="256"/><line x1="137" y1="263" x2="583" y2="263"/></g>
    <rect x="137" y="240" width="446" height="4" fill="#F4F1E8"/>
    <rect x="134" y="236" width="5" height="36" fill="#F4F1E8" opacity=".8"/><rect x="581" y="236" width="5" height="36" fill="#F4F1E8" opacity=".8"/>
  </g>
  <rect x="0" y="330" width="720" height="110" fill="url(#vg)"/>

  <!-- jugador de espaldas -->
  <g id="body" class="t">
    <ellipse cx="170" cy="392" rx="40" ry="7" fill="#000" opacity=".35"/>
    <!-- piernas -->
    <path d="M154 334 L146 392 M186 334 L196 392" stroke="#F4F1E8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M138 394h16M190 394h18" stroke="#F4F1E8" stroke-width="7" stroke-linecap="round"/>
    <!-- pantalón -->
    <path d="M150 302 L192 302 L196 346 L172 340 L148 346Z" fill="#0C1F1D" stroke="#F4F1E8" stroke-width="3" stroke-linejoin="round"/>
    <!-- camiseta -->
    <path d="M148 252 Q170 240 192 252 L196 306 L146 306Z" fill="#F4F1E8"/>
    <!-- brazo izquierdo -->
    <path d="M150 258 L128 288" stroke="#F4F1E8" stroke-width="9" stroke-linecap="round"/>
    <!-- cabeza y gorra -->
    <circle cx="170" cy="228" r="13" fill="#F4F1E8"/>
    <path d="M156 226 Q170 208 184 226Z" fill="#D6E84B"/>
    <!-- brazo y raqueta -->
    <g id="arm" class="t">
      <path d="M192 262 L226 266" stroke="#F4F1E8" stroke-width="9" stroke-linecap="round"/>
      <path d="M226 266 L248 262" stroke="#F4F1E8" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="270" cy="258" rx="12" ry="20" transform="rotate(80 270 258)" fill="none" stroke="#D6E84B" stroke-width="4"/>
      <g stroke="#D6E84B" stroke-width=".9" opacity=".7"><line x1="250" y1="258" x2="290" y2="258"/><line x1="254" y1="251" x2="286" y2="251"/><line x1="254" y1="265" x2="286" y2="265"/><line x1="262" y1="242" x2="262" y2="274"/><line x1="272" y1="240" x2="272" y2="276"/><line x1="282" y1="243" x2="282" y2="273"/></g>
    </g>
  </g>

  <path id="trail" class="t" d="M228 296 Q352 96 482 206" fill="none" stroke="#D6E84B" stroke-width="3" stroke-linecap="round"/>
  <ellipse id="shadow" class="t" rx="9" ry="3" fill="#000"/>
  <circle id="ball1" class="t" r="9" fill="#D6E84B" stroke="#0C1F1D" stroke-width="1.5"/>
  <ellipse id="mark" class="t" cx="484" cy="206" rx="9" ry="3.6" fill="#FF4B3A"/>
</g>

<!-- repetición ampliada tipo ojo de halcón -->
<g id="zoom" class="t">
  <circle cx="360" cy="220" r="150" fill="#0f3d33" stroke="#F4F1E8" stroke-width="5"/>
  <g clip-path="url(#zc)">
    <rect x="250" y="60" width="26" height="320" fill="#F4F1E8"/>
    <ellipse id="zmark" cx="338" cy="220" rx="44" ry="26" fill="#FF4B3A" opacity=".92"/>
    <ellipse cx="338" cy="220" rx="56" ry="34" fill="none" stroke="#FF4B3A" stroke-width="2" opacity=".5"/>
  </g>
  <g stroke="#F4F1E8" stroke-width="2"><line x1="276" y1="150" x2="290" y2="150"/><line x1="276" y1="290" x2="290" y2="290"/></g>
  <g id="zball" class="t"><circle cx="338" cy="220" r="22" fill="#D6E84B" stroke="#0C1F1D" stroke-width="3" opacity=".95"/><path d="M322 205Q336 220 324 238" fill="none" stroke="#F4F1E8" stroke-width="3" stroke-linecap="round"/></g>
  <text id="outtxt" class="t" x="440" y="232" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="54" fill="#FF4B3A" letter-spacing="6">OUT</text>
</g>

<!-- marca: OUT = Time (reloj) + For (4/U) + Tennis (T) -->
<g id="word" class="t" fill="none" stroke="#F4F1E8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
  <g id="clock" class="t">
    <circle cx="230" cy="220" r="74" fill="#D6E84B" stroke="#0C1F1D" stroke-width="5"/>
    <g id="face" class="t" stroke="#0C1F1D" stroke-width="5">
      <path d="M160 198Q230 170 300 198M160 242Q230 270 300 242" stroke="#F4F1E8" stroke-width="3.5" opacity=".7"/>
      <g stroke-width="4"><line x1="230" y1="160" x2="230" y2="172"/><line x1="230" y1="268" x2="230" y2="280"/><line x1="170" y1="220" x2="182" y2="220"/><line x1="278" y1="220" x2="290" y2="220"/></g>
      <line id="hh" class="t" x1="230" y1="220" x2="230" y2="188" stroke-width="7"/>
      <line id="hm" class="t" x1="230" y1="220" x2="230" y2="170" stroke-width="5"/>
      <circle cx="230" cy="220" r="5" fill="#0C1F1D" stroke="none"/>
    </g>
  </g>
  <path class="t ld" d="M352 148V238Q352 286 400 286Q448 286 448 238V148M448 148V302"/>
  <path class="t ld2" d="M498 160H618M558 160V288"/>
  <g id="sub" class="t" fill="#F4F1E8" stroke="none" font-family="Arial,sans-serif" font-weight="700" font-size="22" letter-spacing="7" text-anchor="middle">
    <text x="230" y="360">TIME</text><text x="400" y="360">FOR</text><text x="558" y="360">TENNIS</text>
  </g>
</g>
</svg>
